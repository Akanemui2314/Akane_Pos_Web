<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Booth Tracking Ver.1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pastel: {
              orange: '#E07A5F',
              darkorange: '#C85F43',
              brown: '#3D261D',
              blue: '#A5D8FF'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { 
      font-family: 'Kanit', sans-serif; 
      background: linear-gradient(135deg, #FFF8E7 0%, #FFEAB6 100%);
      overflow: hidden;
      margin: 0;
    }
    
    .physics-item {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
      will-change: transform, opacity;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

  <!-- Container สำหรับวัตถุ Physics -->
  <div id="physics-container" class="absolute inset-0 overflow-hidden pointer-events-none z-0"></div>

  <!-- Login Card -->
  <div class="bg-white/90 backdrop-blur-md rounded-3xl p-8 shadow-2xl max-w-sm w-full text-center border border-white/60 z-10 relative">
    <div class="w-16 h-16 bg-pastel-orange/20 text-pastel-orange rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm">
      <i class="fa-solid fa-lock text-2xl"></i>
    </div>
    
    <h2 class="text-xl font-bold text-pastel-brown mb-1">Booth Tracking</h2>
    <p class="text-xs text-slate-400 mb-6">กรุณาระบุ Username เพื่อเข้าสู่ระบบ</p>

    <div class="space-y-4 text-left">
      <div>
        <label class="block text-xs font-semibold text-pastel-brown/70 mb-1">Username *</label>
        <input type="text" id="login-user" onkeydown="if(event.key==='Enter') handleLogin()" placeholder="ระบุ Username" class="w-full border border-slate-200 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-pastel-orange bg-white/80">
      </div>
      <button onclick="handleLogin()" class="w-full bg-pastel-orange hover:bg-pastel-darkorange text-white font-bold py-3 rounded-xl shadow-md transition flex justify-center items-center gap-2">
        เข้าสู่ระบบ <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <script>
    if (sessionStorage.getItem('isLoggedIn') === 'true') {
      window.location.href = 'index.html';
    }

    function handleLogin() {
      const user = document.getElementById('login-user').value.trim().toLowerCase();
      const allowedUsers = ['akanezz2314', 'notton'];

      if (allowedUsers.includes(user)) {
        sessionStorage.setItem('isLoggedIn', 'true');
        sessionStorage.setItem('loggedInUser', user);
        window.location.href = 'index.html';
      } else {
        alert('⚠️ ไม่พบ Username นี้ในระบบ');
      }
    }

    // ================= REAL 2D PHYSICS ENGINE =================
    const container = document.getElementById('physics-container');
    const objects = [];
    let nextImgIndex = 1;

    const GRAVITY = 0.35;
    const BOUNCE = 0.62;
    const FRICTION = 0.98;

    function spawnPhysicsObject() {
      const img = document.createElement('img');
      img.src = `${nextImgIndex}.png`;
      nextImgIndex = nextImgIndex === 1 ? 2 : 1;

      img.className = 'physics-item';
      
      const size = Math.floor(Math.random() * 25) + 65;
      img.style.width = `${size}px`;
      img.style.height = 'auto';

      container.appendChild(img);

      const obj = {
        element: img,
        x: Math.random() * (window.innerWidth - size - 40) + 20,
        y: -size - 20,
        vx: (Math.random() - 0.5) * 4,
        vy: Math.random() * 2,
        rotation: (Math.random() - 0.5) * 30,
        vRot: (Math.random() - 0.5) * 4,
        size: size,
        opacity: 1,
        lifeTimer: 0,
        isGrounded: false
      };

      objects.push(obj);
    }

    function updatePhysics() {
      const groundY = window.innerHeight;

      for (let i = objects.length - 1; i >= 0; i--) {
        const obj = objects[i];

        obj.vy += GRAVITY;
        obj.vx *= FRICTION;
        obj.x += obj.vx;
        obj.y += obj.vy;
        obj.rotation += obj.vRot;

        if (obj.x <= 0) {
          obj.x = 0;
          obj.vx *= -BOUNCE;
        } else if (obj.x + obj.size >= window.innerWidth) {
          obj.x = window.innerWidth - obj.size;
          obj.vx *= -BOUNCE;
        }

        if (obj.y + obj.size >= groundY) {
          obj.y = groundY - obj.size;
          obj.vy *= -BOUNCE;
          obj.vx *= 0.85;
          obj.vRot *= 0.8;

          if (Math.abs(obj.vy) < 1.2) {
            obj.vy = 0;
            obj.isGrounded = true;
          }
        }

        if (obj.isGrounded) {
          obj.lifeTimer += 1;
          if (obj.lifeTimer > 120) {
            obj.opacity -= 0.02;
          }
        }

        obj.element.style.transform = `translate3d(${obj.x}px, ${obj.y}px, 0) rotate(${obj.rotation}deg)`;
        obj.element.style.opacity = obj.opacity;

        if (obj.opacity <= 0) {
          obj.element.remove();
          objects.splice(i, 1);
        }
      }

      requestAnimationFrame(updatePhysics);
    }

    requestAnimationFrame(updatePhysics);
    setInterval(spawnPhysicsObject, 750);
  </script>
</body>
</html>
